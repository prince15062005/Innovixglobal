<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login | Innovix Global</title>
  <meta name="description" content="Secure administrator login for Innovix Global website management." />
  <link rel="icon" type="image/png" href="../images/innovix-global-logo.png">
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    body { background: #04060a; }
    .admin-shell { min-height: 100vh; display: grid; place-items: center; padding: 32px 20px; }
    .admin-card { width: min(100%, 460px); background: rgba(21, 29, 48, 0.95); border: 1px solid rgba(245, 158, 11, 0.4); border-radius: 24px; padding: 32px; box-shadow: 0 24px 60px rgba(0,0,0,0.45); }
    .admin-title { margin-bottom: 8px; font-size: clamp(2rem, 5vw, 2.5rem); }
    .admin-subtitle { color: var(--text-muted); margin-bottom: 24px; }
    .login-status { display: none; margin-bottom: 16px; padding: 12px 14px; border-radius: 12px; background: rgba(255,255,255,0.04); }
    .login-status.show { display: block; }
    .admin-form .btn { width: 100%; }
  </style>
</head>
<body>
  <div class="admin-shell">
    <div class="admin-card">
      <div class="brand-logo" style="margin-bottom: 18px;" aria-label="Innovix Global home">
        <div class="brand-icon">
          <img src="../images/innovix-logo-mark.svg" alt="Innovix Global logo mark">
        </div>
        <div class="brand-info">
          <span class="brand-name">INNOVIX GLOBAL</span>
          <span class="brand-sub">ADMIN PORTAL</span>
        </div>
      </div>
      <h1 class="admin-title">Secure Access</h1>
      <p class="admin-subtitle">Sign in to manage your website, product catalog, and inquiry pipeline.</p>
      <div id="loginStatus" class="login-status"></div>
      <form id="adminLoginForm" class="admin-form">
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input id="email" name="email" class="form-control" type="email" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input id="password" name="password" class="form-control" type="password" required />
        </div>
        <button class="btn btn-gold" type="submit">Login to Dashboard</button>
      </form>
    </div>
  </div>

  <script>
    const form = document.getElementById('adminLoginForm');
    const status = document.getElementById('loginStatus');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const payload = Object.fromEntries(new FormData(form).entries());

      status.classList.add('show');
      status.innerHTML = '<span style="color: var(--accent-gold)"><i class="ri-loader-4-line"></i> Authenticating...</span>';

      try {
        const response = await fetch('/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const result = await response.json();

        if (!response.ok || !result.success) {
          throw new Error(result.error || 'Authentication failed.');
        }

        window.location.href = result.redirect || '/admin/dashboard';
      } catch (error) {
        status.innerHTML = '<span style="color: #ef4444"><i class="ri-error-warning-line"></i> ' + error.message + '</span>';
      }
    });
  </script>
</body>
</html>
