<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Secure administrator login for INNOVIX GLOBAL website management.">
  <title>Admin Login | INNOVIX GLOBAL</title>
  <link rel="icon" type="image/svg+xml" href="../images/innovix-logo-full-black.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body { background: var(--color-primary); min-height: 100vh; }
    .admin-shell { min-height: 100vh; display: grid; place-items: center; padding: 32px 20px; }
  </style>
</head>
<body>
  <div class="admin-shell">
    <div class="admin-login-card">
      <div class="admin-login-header">
        <div class="admin-login-logo">
            <img src="../images/innovix-logo-full-black.svg" alt="INNOVIX GLOBAL Logo" style="width: 100%; height: 100%; object-fit: contain;">
          </div>
        <h1 class="admin-login-title">Secure Access</h1>
        <p class="admin-login-subtitle">Sign in to manage your website, product catalog, and enquiry pipeline.</p>
      </div>
      <div id="loginStatus" class="admin-login-error" style="display: none;"></div>
      <form id="adminLoginForm" class="admin-login-form">
        <div class="form-group">
          <label for="email" class="form-label">Email</label>
          <input type="email" id="email" name="email" class="form-input" placeholder="admin@innovixglobal.in" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" name="password" class="form-input" placeholder="Enter your password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 8px;">
          <i class="ri-login-box-line"></i> Login to Dashboard
        </button>
      </form>
      <div class="admin-login-footer">
        <p>INNOVIX GLOBAL Admin Portal &copy; 2026</p>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('adminLoginForm');
    const status = document.getElementById('loginStatus');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const payload = Object.fromEntries(new FormData(form).entries());

      status.style.display = 'block';
      status.style.background = 'rgba(197, 161, 90, 0.1)';
      status.style.border = '1px solid var(--border-gold)';
      status.style.color = 'var(--color-gold)';
      status.innerHTML = '<i class="ri-loader-4-line" style="animation: spin 1s linear infinite;"></i> Authenticating...';

      try {
        const response = await fetch('/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const result = await response.json();

        if (!response.ok || !result.success) {
          throw new Error(result.error || 'Authentication failed.');
        }

        window.location.href = result.redirect || '/admin/dashboard';
      } catch (error) {
        status.style.background = 'rgba(239, 68, 68, 0.1)';
        status.style.border = '1px solid rgba(239, 68, 68, 0.3)';
        status.style.color = '#EF4444';
        status.innerHTML = '<i class="ri-error-warning-line"></i> ' + error.message;
      }
    });
  </script>
</body>
</html>
