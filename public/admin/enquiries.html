<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enquiries Management | INNOVIX GLOBAL Admin</title>
  <link rel="icon" type="image/svg+xml" href="../images/innovix-logo-full.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar" id="adminSidebar">
      <div class="admin-sidebar-header">
        <a href="dashboard.html" class="admin-brand">
          <div class="admin-brand-icon">
            <img src="../images/innovix-logo-full.svg" alt="INNOVIX GLOBAL Logo" style="width: 100%; height: 100%; object-fit: contain;">
          </div>
          <span class="admin-brand-name">INNOVIX GLOBAL</span>
        </a>
      </div>
      <nav class="admin-nav" aria-label="Admin navigation">
        <a href="dashboard.html" class="admin-nav-item"><i class="ri-dashboard-line"></i> Dashboard</a>
        <a href="products.html" class="admin-nav-item"><i class="ri-grid-line"></i> Products</a>
        <a href="categories.html" class="admin-nav-item"><i class="ri-folder-line"></i> Categories</a>
        <a href="enquiries.html" class="admin-nav-item active"><i class="ri-message-3-line"></i> Enquiries</a>
        <a href="settings.html" class="admin-nav-item"><i class="ri-settings-3-line"></i> Settings</a>
      </nav>
      <div class="admin-sidebar-footer">
        <div class="admin-user">
          <div class="admin-user-avatar"><span id="adminInitials">SA</span></div>
          <div class="admin-user-info">
            <div class="admin-user-name" id="adminName">Super Admin</div>
            <div class="admin-user-role" id="adminRole">Super Admin</div>
          </div>
        </div>
      </div>
    </aside>

    <div class="mobile-menu-overlay" id="sidebarOverlay" aria-hidden="true"></div>

    <main class="admin-main">
      <header class="admin-header">
        <div style="display: flex; align-items: center; gap: 16px;">
          <button class="mobile-menu-btn" id="sidebarToggle" aria-label="Toggle sidebar" style="display: none;"><i class="ri-menu-line"></i></button>
          <h1 class="admin-header-title">Enquiries Management</h1>
        </div>
      </header>

      <div class="admin-content">
        <div class="admin-page-header">
          <h1 class="admin-page-title">Enquiries</h1>
          <div style="color: var(--color-neutral-muted);">Manage customer enquiries and quotes</div>
        </div>

        <!-- Filters -->
        <div style="display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 24px; align-items: center;">
          <div style="flex: 1; min-width: 280px; position: relative;">
            <i class="ri-search-line" style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--color-neutral-muted);"></i>
            <input type="text" id="searchEnquiries" class="form-input" placeholder="Search enquiries..." style="padding-left: 48px;">
          </div>
          <select id="filterEnquiryStatus" class="form-select" style="width: auto; min-width: 180px;">
            <option value="">All Status</option>
            <option value="new">New</option>
            <option value="pending">Pending</option>
            <option value="contacted">Contacted</option>
            <option value="completed">Completed</option>
          </select>
        </div>

        <!-- Enquiries Table -->
        <div class="admin-table-container">
          <table class="admin-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Subject</th>
                <th>Product</th>
                <th>Status</th>
                <th>Date</th>
                <th style="width: 100px;">Actions</th>
              </tr>
            </thead>
            <tbody id="enquiriesTableBody"></tbody>
          </table>
        </div>

        <!-- Pagination -->
        <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 24px; flex-wrap: wrap; gap: 16px;">
          <div style="color: var(--color-neutral-muted);" id="enquiryPaginationInfo">Showing 0 of 0 enquiries</div>
          <div style="display: flex; gap: 8px;" id="enquiryPaginationControls"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- Enquiry Detail Modal -->
  <div class="modal-overlay" id="enquiryModal" role="dialog" aria-modal="true" aria-labelledby="enquiryModalTitle">
    <div class="modal" style="max-width: 700px;">
      <div class="modal-header">
        <h2 class="modal-title" id="enquiryModalTitle">Enquiry Details</h2>
        <button class="modal-close" id="enquiryModalClose" aria-label="Close modal"><i class="ri-close-line"></i></button>
      </div>
      <div class="modal-body" id="enquiryModalBody"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" id="enquiryModalCloseBtn">Close</button>
      </div>
    </div>
  </div>

  <script>
    // Mobile sidebar toggle
    const sidebarToggle = document.getElementById('sidebarToggle');
    const adminSidebar = document.getElementById('adminSidebar');
    const sidebarOverlay = document.getElementById('sidebarOverlay');
    
    if (sidebarToggle && adminSidebar && sidebarOverlay) {
      sidebarToggle.addEventListener('click', () => {
        adminSidebar.classList.toggle('open');
        sidebarOverlay.classList.toggle('active');
      });
      sidebarOverlay.addEventListener('click', () => {
        adminSidebar.classList.remove('open');
        sidebarOverlay.classList.remove('active');
      });
    }

    function checkScreenSize() {
      if (window.innerWidth < 992) sidebarToggle.style.display = 'flex';
      else { sidebarToggle.style.display = 'none'; adminSidebar.classList.remove('open'); sidebarOverlay.classList.remove('active'); }
    }
    window.addEventListener('resize', checkScreenSize);
    checkScreenSize();

    let allEnquiries = [];
    let currentPage = 1;
    const enquiriesPerPage = 20;

    async function fetchJSON(url, options) {
      const res = await fetch(url, options || {});
      const payload = await res.json();
      if (!res.ok) throw new Error(payload.error || 'Request failed.');
      return payload;
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer') || createToastContainer();
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      const icons = { success: '<i class="ri-checkbox-circle-line toast-icon"></i>', error: '<i class="ri-error-warning-line toast-icon"></i>', warning: '<i class="ri-alert-line toast-icon"></i>', info: '<i class="ri-information-line toast-icon"></i>' };
      toast.innerHTML = `${icons[type] || icons.info}<span class="toast-message">${message}</span><button class="toast-close" onclick="this.parentElement.remove()"><i class="ri-close-line"></i></button>`;
      container.appendChild(toast);
      setTimeout(() => { toast.style.animation = 'slideInRight 0.3s ease-out reverse'; setTimeout(() => toast.remove(), 300); }, 5000);
    }
    function createToastContainer() { const c = document.createElement('div'); c.id = 'toastContainer'; c.className = 'toast-container'; document.body.appendChild(c); return c; }

    async function loadEnquiries() {
      try {
        const params = new URLSearchParams();
        const search = document.getElementById('searchEnquiries').value;
        const status = document.getElementById('filterEnquiryStatus').value;
        
        if (search) params.set('search', search);
        if (status) params.set('status', status);
        
        const data = await fetchJSON('/api/admin/enquiries?' + params.toString());
        allEnquiries = data.enquiries || [];
        renderEnquiries();
      } catch (error) {
        showToast(error.message, 'error');
      }
    }

    function getStatusClass(status) {
      const classes = { new: 'status-new', pending: 'status-new', contacted: 'status-contacted', completed: 'status-completed' };
      return classes[status] || 'status-new';
    }
    function getStatusLabel(status) {
      const labels = { new: 'New', pending: 'Pending', contacted: 'Contacted', completed: 'Completed' };
      return labels[status] || status;
    }
    function formatDate(dateString) {
      const date = new Date(dateString);
      return date.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function renderEnquiries() {
      const tbody = document.getElementById('enquiriesTableBody');
      const start = (currentPage - 1) * enquiriesPerPage;
      const end = start + enquiriesPerPage;
      const pageEnquiries = allEnquiries.slice(start, end);

      if (!pageEnquiries.length) {
        tbody.innerHTML = '<tr><td colspan="9" style="text-align: center; padding: 40px; color: var(--color-neutral-muted);">No enquiries found.</td></tr>';
      } else {
        tbody.innerHTML = pageEnquiries.map(e => `
          <tr>
            <td><code style="color: var(--color-gold);">${e.id}</code></td>
            <td style="font-weight: 500;">${e.name}</td>
            <td>${e.email}</td>
            <td>${e.phone}</td>
            <td>${e.subject || 'General enquiry'}</td>
            <td>${e.productCode || '-'}</td>
            <td><select data-id="${e.id}" class="form-select" style="width: auto; padding: 6px 28px 6px 10px; font-size: 0.8125rem;">
              <option value="new" ${e.status === 'new' ? 'selected' : ''}>New</option>
              <option value="pending" ${e.status === 'pending' ? 'selected' : ''}>Pending</option>
              <option value="contacted" ${e.status === 'contacted' ? 'selected' : ''}>Contacted</option>
              <option value="completed" ${e.status === 'completed' ? 'selected' : ''}>Completed</option>
            </select></td>
            <td style="color: var(--color-neutral-muted); font-size: 0.875rem;">${formatDate(e.createdAt)}</td>
            <td>
              <div class="admin-actions">
                <button class="admin-action-btn" data-id="${e.id}" data-action="view" aria-label="View"><i class="ri-eye-line"></i></button>
                <button class="admin-action-btn delete" data-id="${e.id}" data-action="delete" aria-label="Delete"><i class="ri-delete-bin-line"></i></button>
              </div>
            </td>
          </tr>
        `).join('');

        // Status change
        tbody.querySelectorAll('select[data-id]').forEach(select => {
          select.addEventListener('change', async (e) => {
            const id = e.target.dataset.id;
            try {
              await fetchJSON('/api/admin/enquiries/' + id, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status: e.target.value }) });
              showToast('Status updated', 'success');
              loadEnquiries();
            } catch (error) { showToast(error.message, 'error'); loadEnquiries(); }
          });
        });

        // View/Delete
        tbody.querySelectorAll('.admin-action-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const id = btn.dataset.id;
            const action = btn.dataset.action;
            if (action === 'view') openEnquiryModal(id);
            if (action === 'delete') openDeleteModal(id);
          });
        });
      }

      // Pagination
      const totalPages = Math.ceil(allEnquiries.length / enquiriesPerPage);
      const info = document.getElementById('enquiryPaginationInfo');
      const controls = document.getElementById('enquiryPaginationControls');
      
      info.textContent = `Showing ${Math.min(start + 1, allEnquiries.length)}–${Math.min(end, allEnquiries.length)} of ${allEnquiries.length} enquiries`;
      
      if (totalPages <= 1) { controls.innerHTML = ''; return; }
      
      let html = '';
      if (currentPage > 1) html += `<button class="btn btn-secondary btn-sm" data-page="${currentPage - 1}"><i class="ri-arrow-left-line"></i></button>`;
      const startPage = Math.max(1, currentPage - 2);
      const endPage = Math.min(totalPages, currentPage + 2);
      for (let i = startPage; i <= endPage; i++) {
        html += `<button class="btn ${i === currentPage ? 'btn-primary' : 'btn-secondary'} btn-sm" data-page="${i}" ${i === currentPage ? 'aria-current="page"' : ''}>${i}</button>`;
      }
      if (currentPage < totalPages) html += `<button class="btn btn-secondary btn-sm" data-page="${currentPage + 1}"><i class="ri-arrow-right-line"></i></button>`;
      controls.innerHTML = html;
      controls.querySelectorAll('[data-page]').forEach(btn => { btn.addEventListener('click', () => { currentPage = parseInt(btn.dataset.page); renderEnquiries(); }); });
    }

    // Enquiry Detail Modal
    const enquiryModal = document.getElementById('enquiryModal');
    const enquiryModalClose = document.getElementById('enquiryModalClose');
    const enquiryModalCloseBtn = document.getElementById('enquiryModalCloseBtn');
    const enquiryModalBody = document.getElementById('enquiryModalBody');

    function openEnquiryModal(id) {
      const enquiry = allEnquiries.find(e => e.id === id);
      if (!enquiry) return;
      
      enquiryModalBody.innerHTML = `
        <div style="display: grid; gap: 16px;">
          <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px;">
            <div><label style="font-size: 0.75rem; color: var(--color-neutral-muted); text-transform: uppercase;">ID</label><div style="font-family: var(--font-display); color: var(--color-gold);">${enquiry.id}</div></div>
            <div><label style="font-size: 0.75rem; color: var(--color-neutral-muted); text-transform: uppercase;">Status</label><div><span class="status-badge ${getStatusClass(enquiry.status)}">${getStatusLabel(enquiry.status)}</span></div></div>
            <div><label style="font-size: 0.75rem; color: var(--color-neutral-muted); text-transform: uppercase;">Subject</label><div>${enquiry.subject || 'General enquiry'}</div></div>
            <div><label style="font-size: 0.75rem; color: var(--color-neutral-muted); text-transform: uppercase;">Product</label><div>${enquiry.productCode || '-'}</div></div>
          </div>
          <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px;">
            <div><label style="font-size: 0.75rem; color: var(--color-neutral-muted); text-transform: uppercase;">Name</label><div>${enquiry.name}</div></div>
            <div><label style="font-size: 0.75rem; color: var(--color-neutral-muted); text-transform: uppercase;">Email</label><div><a href="mailto:${enquiry.email}" style="color: var(--color-gold);">${enquiry.email}</a></div></div>
            <div><label style="font-size: 0.75rem; color: var(--color-neutral-muted); text-transform: uppercase;">Phone</label><div><a href="tel:${enquiry.phone}" style="color: var(--color-gold);">${enquiry.phone}</a></div></div>
            <div><label style="font-size: 0.75rem; color: var(--color-neutral-muted); text-transform: uppercase;">Company</label><div>${enquiry.company || '-'}</div></div>
          </div>
          <div>
            <label style="font-size: 0.75rem; color: var(--color-neutral-muted); text-transform: uppercase;">Message</label>
            <div style="background: var(--bg-primary); padding: 16px; border-radius: var(--radius-md); border: 1px solid var(--border-subtle); white-space: pre-wrap;">${enquiry.message || 'No message provided'}</div>
          </div>
          <div style="padding-top: 16px; border-top: 1px solid var(--border-subtle); color: var(--color-neutral-muted); font-size: 0.875rem;">
            Received: ${formatDate(enquiry.createdAt)}${enquiry.updatedAt ? ' | Updated: ' + formatDate(enquiry.updatedAt) : ''}
          </div>
        </div>
      `;
      
      enquiryModal.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeEnquiryModal() {
      enquiryModal.classList.remove('active');
      document.body.style.overflow = 'auto';
    }

    enquiryModalClose.addEventListener('click', closeEnquiryModal);
    enquiryModalCloseBtn.addEventListener('click', closeEnquiryModal);
    enquiryModal.addEventListener('click', (e) => { if (e.target === enquiryModal) closeEnquiryModal(); });

    // Delete modal
    let deleteEnquiryId = null;
    const deleteModal = document.createElement('div');
    deleteModal.className = 'modal-overlay';
    deleteModal.innerHTML = `
      <div class="modal" style="max-width: 480px;">
        <div class="modal-header"><h2 class="modal-title">Delete Enquiry</h2><button class="modal-close" id="deleteEnquiryModalClose"><i class="ri-close-line"></i></button></div>
        <div class="modal-body"><p style="color: var(--color-neutral);">Are you sure you want to delete this enquiry? This action cannot be undone.</p></div>
        <div class="modal-footer"><button type="button" class="btn btn-secondary" id="deleteEnquiryModalCancel">Cancel</button><button type="button" class="btn btn-danger" id="deleteEnquiryModalConfirm">Delete</button></div>
      </div>
    `;
    document.body.appendChild(deleteModal);

    function openDeleteModal(id) {
      deleteEnquiryId = id;
      deleteModal.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeDeleteModal() {
      deleteModal.classList.remove('active');
      document.body.style.overflow = 'auto';
      deleteEnquiryId = null;
    }

    document.getElementById('deleteEnquiryModalClose').addEventListener('click', closeDeleteModal);
    document.getElementById('deleteEnquiryModalCancel').addEventListener('click', closeDeleteModal);
    deleteModal.addEventListener('click', (e) => { if (e.target === deleteModal) closeDeleteModal(); });

    document.getElementById('deleteEnquiryModalConfirm').addEventListener('click', async () => {
      if (!deleteEnquiryId) return;
      const btn = document.getElementById('deleteEnquiryModalConfirm');
      const originalText = btn.innerHTML;
      btn.disabled = true; btn.innerHTML = '<i class="ri-loader-4-line" style="animation: spin 1s linear infinite;"></i> Deleting...';
      try {
        await fetchJSON('/api/admin/enquiries/' + deleteEnquiryId, { method: 'DELETE' });
        showToast('Enquiry deleted', 'success');
        closeDeleteModal();
        loadEnquiries();
      } catch (error) { showToast(error.message, 'error'); }
      finally { btn.disabled = false; btn.innerHTML = originalText; }
    });

    // Search & Filter
    document.getElementById('searchEnquiries').addEventListener('input', debounce(loadEnquiries, 300));
    document.getElementById('filterEnquiryStatus').addEventListener('change', () => { currentPage = 1; loadEnquiries(); });

    function debounce(fn, delay) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn.apply(this, a), delay); }; }

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await fetch('/admin/logout', { method: 'POST' });
      window.location.href = '/admin/login';
    });

    loadEnquiries();
  </script>
</body>
</html>
